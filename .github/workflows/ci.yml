name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run check

      - name: Inspect package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Install DSH companion dependencies
        working-directory: dsh-plugin
        run: npm ci

      - name: Build and test DSH companion
        working-directory: dsh-plugin
        run: npm run check

      - name: Inspect DSH companion package
        working-directory: dsh-plugin
        run: npm pack --dry-run --ignore-scripts
